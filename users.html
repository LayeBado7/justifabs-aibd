{% extends 'base.html' %}{% block content %}<div class="page-title"><h1>Administration des utilisateurs</h1><p>Création des comptes agents, RH et administrateurs.</p></div><div class="detail-grid"><section class="panel"><h2>Nouvel utilisateur</h2><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><div class="grid2"><label>Matricule<input name="matricule" required></label><label>Nom complet<input name="full_name" required></label><label>E-mail<input type="email" name="email" required></label><label>Département<input name="department"></label><label>Site<select name="site"><option>DIASS</option><option>YOFF</option><option>SAINT-LOUIS</option><option>ZIGUINCHOR</option><option>CAP-SKIRRING</option></select></label><label>Rôle<select name="role"><option value="agent">Agent</option><option value="manager">Manager</option><option value="rh">RH</option><option value="admin">Administrateur</option></select></label></div><label>Mot de passe initial<input type="password" name="password" required minlength="8"></label><button>Créer le compte</button></form></section><section class="panel"><h2>Comptes existants</h2><div class="users">{% for u in users %}<div class="user-row"><div><b>{{ u.full_name }}</b><small>{{ u.email }} · {{ u.matricule }}</small></div><div><span class="badge">{{ u.role }}</span><form class="inline-form" method="post" action="/admin/utilisateurs/{{ u.id }}/toggle"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="small-button">{{ "Désactiver" if u.is_active else "Activer" }}</button></form></div></div>{% endfor %}</div></section></div>{% endblock %}
