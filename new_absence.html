{% extends 'base.html' %}{% block content %}<div class="page-title"><h1>Nouveau justificatif d'absence</h1><p>Renseignez la période et joignez les pièces justificatives disponibles.</p></div><section class="panel form-panel"><form method="post" enctype="multipart/form-data"><div class="grid2"><label>Type d'absence<select name="absence_type" required><option>Maladie</option><option>Accident du travail</option><option>Événement familial</option><option>Autorisation d'absence</option><option>Congé exceptionnel</option><option>Autre</option></select></label><label>Agent<input value="{{ user.full_name }} — {{ user.matricule }}" disabled></label><label>Date de début<input type="date" name="start_date" required></label><label>Date de fin<input type="date" name="end_date" required></label></div><label>Motif ou précision<textarea name="reason" rows="4" placeholder="Informations utiles au traitement du dossier"></textarea></label><label>Pièces justificatives<input type="file" name="documents" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"><small>PDF, image ou document bureautique — 10 Mo maximum par fichier.</small></label><div class="actions"><a class="button secondary" href="/">Annuler</a><button>Soumettre le dossier</button></div></form></section>{% endblock %}
