services:
  - type: web
    name: justifabs-aibd
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: JustifAbs AIBD SA
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////app/data/aibd_absences.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: COOKIE_SECURE
        value: true
      - key: SESSION_MAX_AGE
        value: 28800
      - key: MAX_UPLOAD_MB
        value: 10
      - key: MAX_FILES_PER_DOSSIER
        value: 10
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Administrateur JustifAbs
    disk:
      name: justifabs-data
      mountPath: /app/data
      sizeGB: 1
