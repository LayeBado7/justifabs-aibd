services:
  - type: web
    name: justifabs-aibd
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/aibd_absences.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: COOKIE_SECURE
        value: true
    disk:
      name: justifabs-data
      mountPath: /app/data
      sizeGB: 1
