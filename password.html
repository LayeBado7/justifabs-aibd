{% extends 'base.html' %}{% block content %}<div class="page-title"><h1>Modifier mon mot de passe</h1><p>Utilisez au moins 10 caractères, avec majuscule, minuscule et chiffre.</p></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Mot de passe actuel<input type="password" name="current_password" required></label><label>Nouveau mot de passe<input type="password" name="new_password" required minlength="10"></label><label>Confirmation<input type="password" name="confirm_password" required minlength="10"></label><button>Enregistrer</button></form></section>{% endblock %}
